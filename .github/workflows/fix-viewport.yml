name: Fix game viewport

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch responsive viewport
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_root = '''        .game-root {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            transform-origin: top left;
            background-color: #090a0f;
        }'''
          new_root = '''        .game-root {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            transform-origin: top left;
            background-color: #090a0f;
            font-size: clamp(14px, 1.8dvh, 16px);
        }

        /* Size mobile UI from the logical game height, not portrait viewport width. */
        .game-root .joystick-pad {
            width: clamp(6.5rem, 16dvh, 8.25rem);
            height: clamp(6.5rem, 16dvh, 8.25rem);
        }

        .game-root .crosshair {
            width: clamp(2.75rem, 6dvh, 3.75rem);
            height: clamp(2.75rem, 6dvh, 3.75rem);
        }

        @media (pointer: coarse), (max-width: 900px) {
            .game-root #touch-fire {
                width: clamp(4.5rem, 11dvh, 6rem) !important;
                height: clamp(4.5rem, 11dvh, 6rem) !important;
            }
            .game-root #touch-reload,
            .game-root #touch-sprint {
                width: clamp(3rem, 7dvh, 4rem) !important;
                height: clamp(3rem, 7dvh, 4rem) !important;
            }
            .game-root #joystick-knob {
                width: clamp(2.75rem, 6dvh, 3.5rem) !important;
                height: clamp(2.75rem, 6dvh, 3.5rem) !important;
            }
        }'''
          if old_root not in text:
              raise SystemExit('Expected .game-root CSS block not found')
          text = text.replace(old_root, new_root, 1)

          old_joystick = '''        .joystick-pad {
            touch-action: none;
            width: clamp(6.5rem, 16vw, 8.25rem);
            height: clamp(6.5rem, 16vw, 8.25rem);
        }'''
          new_joystick = '''        .joystick-pad {
            touch-action: none;
            width: clamp(6.5rem, 16dvh, 8.25rem);
            height: clamp(6.5rem, 16dvh, 8.25rem);
        }'''
          if old_joystick not in text:
              raise SystemExit('Expected joystick CSS block not found')
          text = text.replace(old_joystick, new_joystick, 1)

          start = text.index('        function updateLandscapeViewport() {')
          end = text.index('\n        function flipLandscapeOrientation()', start)
          new_viewport = '''        function resizeRendererToDisplaySize() {
            const width = Math.max(1, Math.round(canvas.clientWidth));
            const height = Math.max(1, Math.round(canvas.clientHeight));
            const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
            const targetWidth = Math.max(1, Math.floor(width * pixelRatio));
            const targetHeight = Math.max(1, Math.floor(height * pixelRatio));

            if (canvas.width !== targetWidth || canvas.height !== targetHeight) {
                renderer.setSize(width, height, false);
                return true;
            }
            return false;
        }

        function updateLandscapeViewport() {
            const vv = window.visualViewport;
            const winW = Math.max(1, Math.round(vv ? vv.width : window.innerWidth));
            const winH = Math.max(1, Math.round(vv ? vv.height : window.innerHeight));

            gameRoot.classList.remove('game-root--rotate-cw', 'game-root--rotate-ccw');

            // Maintain one landscape coordinate system even on a portrait phone.
            if (winH > winW) {
                activeRotation = preferredPortraitSide;
                viewW = winH;
                viewH = winW;
                gameRoot.style.width = `${viewW}px`;
                gameRoot.style.height = `${viewH}px`;
                if (activeRotation === 'cw') {
                    gameRoot.style.top = '0px';
                    gameRoot.style.left = `${winW}px`;
                    gameRoot.classList.add('game-root--rotate-cw');
                } else {
                    gameRoot.style.top = `${winH}px`;
                    gameRoot.style.left = '0px';
                    gameRoot.classList.add('game-root--rotate-ccw');
                }
            } else {
                activeRotation = 'none';
                viewW = winW;
                viewH = winH;
                gameRoot.style.width = `${viewW}px`;
                gameRoot.style.height = `${viewH}px`;
                gameRoot.style.top = '0px';
                gameRoot.style.left = '0px';
            }

            gameRoot.style.setProperty('--game-width', `${viewW}px`);
            gameRoot.style.setProperty('--game-height', `${viewH}px`);

            // Let the transformed root finish layout before measuring the canvas.
            requestAnimationFrame(() => {
                resizeRendererToDisplaySize();
                const canvasW = Math.max(1, canvas.clientWidth);
                const canvasH = Math.max(1, canvas.clientHeight);
                camera.aspect = canvasW / canvasH;
                camera.updateProjectionMatrix();
            });
        }'''
          text = text[:start] + new_viewport + text[end:]

          old_listeners = '''        window.addEventListener('resize', updateLandscapeViewport);
        window.addEventListener('orientationchange', () => {
            setTimeout(updateLandscapeViewport, 120);
        });'''
          new_listeners = '''        window.addEventListener('resize', updateLandscapeViewport, { passive: true });
        window.addEventListener('orientationchange', () => {
            setTimeout(updateLandscapeViewport, 120);
        }, { passive: true });
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', updateLandscapeViewport, { passive: true });
        }'''
          if old_listeners not in text:
              raise SystemExit('Expected resize listeners not found')
          text = text.replace(old_listeners, new_listeners, 1)

          old_render = '            renderer.render(scene, camera);'
          new_render = '''            // Keep Three.js matched to the actual canvas display size.
            if (resizeRendererToDisplaySize()) {
                const canvasW = Math.max(1, canvas.clientWidth);
                const canvasH = Math.max(1, canvas.clientHeight);
                camera.aspect = canvasW / canvasH;
                camera.updateProjectionMatrix();
            }
            renderer.render(scene, camera);'''
          if old_render not in text:
              raise SystemExit('Expected render call not found')
          text = text.replace(old_render, new_render, 1)

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/fix-viewport.yml').unlink()
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-viewport.yml
          git commit -m "Fix responsive game viewport scaling [skip ci]"
          git push
