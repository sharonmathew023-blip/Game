<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DEAD ZONE: OUTBREAK 3D - Zombie FPS</title>
    <!-- Tailwind CSS for Tactical HUD & Menus -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js r128 for 3D WebGL Rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Google Fonts: Rajdhani & Teko for modern military/arcade shooter aesthetics -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Teko:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --blood-red: #dc2626;
            --blood-red-glow: rgba(220, 38, 38, 0.45);
            --neon-amber: #f59e0b;
            --tactical-cyan: #06b6d4;
            --toxic-green: #22c55e;
            --panel-bg: rgba(10, 14, 22, 0.74);
            --panel-danger-bg: rgba(28, 10, 14, 0.82);
            --panel-border: rgba(255, 255, 255, 0.14);
            --hud-pad: clamp(0.4rem, 1vw, 0.75rem);
            --hud-gap: clamp(0.4rem, 1vw, 0.75rem);
            --hud-radius: 0.75rem;
            --ch-spread: 0.625rem;
            --ch-color: rgba(255, 255, 255, 0.92);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #090a0f;
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(13px, 1.05vw, 16px);
            color: #f8fafc;
            touch-action: none;
        }

        .font-display {
            font-family: 'Teko', sans-serif;
            letter-spacing: 0.06em;
        }

        .game-root {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            transform-origin: top left;
            background-color: #090a0f;
        }

        .game-root--rotate-cw {
            top: 0;
            left: 100vw;
            transform: rotate(90deg);
        }

        .game-root--rotate-ccw {
            top: 100vh;
            left: 0;
            transform: rotate(-90deg);
        }

        .canvas-stage {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .canvas-stage__webgl {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        /* Flat BEM Tactical Glassmorphism Panels */
        .hud-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--panel-border);
            border-radius: var(--hud-radius);
            padding: var(--hud-pad);
            box-shadow: 0 0.5rem 2rem rgba(0, 0, 0, 0.6);
        }

        .hud-panel--danger {
            background: var(--panel-danger-bg);
            border-color: rgba(239, 68, 68, 0.4);
            box-shadow: 0 0 1.5rem rgba(220, 38, 38, 0.25);
        }

        /* GPU-Composited Progress Bar Fill */
        .hud-bar__fill {
            width: 100%;
            height: 100%;
            transform-origin: left center;
            transform: scaleX(1);
            transition: transform 0.14s ease-out;
            will-change: transform;
        }

        /* Dynamic Damage & Low HP Vignettes (GPU Opacity Only) */
        .fx-vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 15;
            background: radial-gradient(circle, transparent 45%, rgba(220, 38, 38, 0.85) 100%);
            opacity: 0;
            transition: opacity 0.18s ease-out;
            will-change: opacity;
        }

        .fx-low-hp {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 14;
            background: radial-gradient(circle, transparent 55%, rgba(185, 28, 28, 0.55) 100%);
            opacity: 0;
            animation: pulseBlood 1.1s infinite ease-in-out;
            will-change: opacity;
        }

        @keyframes pulseBlood {
            0%, 100% { opacity: 0.15; }
            50% { opacity: 0.65; }
        }

        /* Dynamic GPU-Accelerated Crosshair (BEM Flat Selectors) */
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate3d(-50%, -50%, 0);
            pointer-events: none;
            z-index: 20;
            width: 3.75rem;
            height: 3.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            will-change: transform;
        }

        .crosshair--target {
            --ch-color: #ef4444;
        }

        .crosshair--headshot {
            --ch-color: #facc15;
        }

        .crosshair__line {
            position: absolute;
            background: var(--ch-color);
            box-shadow: 0 0 0.25rem rgba(0, 0, 0, 0.9);
            transition: transform 0.05s ease-out, background-color 0.1s ease;
            will-change: transform;
        }

        .crosshair__line--top {
            width: 0.125rem;
            height: 0.625rem;
            transform: translate3d(0, calc(-1 * var(--ch-spread)), 0);
        }

        .crosshair__line--bottom {
            width: 0.125rem;
            height: 0.625rem;
            transform: translate3d(0, var(--ch-spread), 0);
        }

        .crosshair__line--left {
            width: 0.625rem;
            height: 0.125rem;
            transform: translate3d(calc(-1 * var(--ch-spread)), 0, 0);
        }

        .crosshair__line--right {
            width: 0.625rem;
            height: 0.125rem;
            transform: translate3d(var(--ch-spread), 0, 0);
        }

        .crosshair__dot {
            width: 0.25rem;
            height: 0.25rem;
            border-radius: 50%;
            background: #22d3ee;
            box-shadow: 0 0 0.375rem #22d3ee;
            transition: transform 0.1s ease, background-color 0.1s ease;
        }

        .crosshair--target .crosshair__dot {
            background: #ef4444;
            box-shadow: 0 0 0.5rem #ef4444;
            transform: scale(1.35);
        }

        .crosshair--headshot .crosshair__dot {
            background: #facc15;
            box-shadow: 0 0 0.6rem #facc15;
            transform: scale(1.55);
        }

        /* Hitmarker X */
        .hitmarker {
            position: absolute;
            width: 1.75rem;
            height: 1.75rem;
            opacity: 0;
            transform: scale(0.6);
            transition: opacity 0.08s ease, transform 0.08s ease;
            pointer-events: none;
            will-change: transform, opacity;
        }

        .hitmarker--active {
            opacity: 1;
            transform: scale(1.05);
        }

        .hitmarker--crit {
            opacity: 1;
            transform: scale(1.35);
            filter: drop-shadow(0 0 0.375rem #facc15);
        }

        /* GPU-Accelerated Floating Damage Text */
        .floating-dmg {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            font-family: 'Teko', sans-serif;
            font-weight: 700;
            z-index: 22;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
            will-change: transform, opacity;
            animation: floatUpFade 0.72s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes floatUpFade {
            0% {
                opacity: 1;
                transform: translate3d(var(--fx-x, 0px), var(--fx-y, 0px), 0) translate(-50%, -50%) scale(0.75);
            }
            28% {
                opacity: 1;
                transform: translate3d(var(--fx-x, 0px), calc(var(--fx-y, 0px) - 1.4rem), 0) translate(-50%, -50%) scale(1.15);
            }
            100% {
                opacity: 0;
                transform: translate3d(var(--fx-x, 0px), calc(var(--fx-y, 0px) - 3.2rem), 0) translate(-50%, -50%) scale(0.9);
            }
        }

        /* Button & Weapon Slot BEM Modifiers */
        .btn-tactical {
            background: linear-gradient(135deg, var(--blood-red) 0%, #991b1b 100%);
            border: 1px solid rgba(252, 165, 165, 0.4);
            box-shadow: 0 0.25rem 1rem var(--blood-red-glow), inset 0 1px 0 rgba(255, 255, 255, 0.25);
            transition: transform 0.15s ease, opacity 0.15s ease;
            will-change: transform;
        }
        .btn-tactical:hover {
            transform: translate3d(0, -2px, 0);
        }
        .btn-tactical:active {
            transform: translate3d(0, 1px, 0);
        }

        .weapon-slot {
            transition: transform 0.16s ease, border-color 0.16s ease, background-color 0.16s ease;
        }
        .weapon-slot--active {
            border-color: var(--neon-amber) !important;
            background: rgba(245, 158, 11, 0.18) !important;
            box-shadow: 0 0 0.9rem rgba(245, 158, 11, 0.3);
            transform: translate3d(0, -2px, 0);
        }

        .svg-icon {
            width: 1em;
            height: 1em;
            fill: currentColor;
            display: inline-block;
            vertical-align: -0.125em;
            flex-shrink: 0;
        }

        /* Mobile Virtual Controls & Snap-to-Touch Zone */
        .joystick-pad {
            touch-action: none;
            width: clamp(6.5rem, 16vw, 8.25rem);
            height: clamp(6.5rem, 16vw, 8.25rem);
        }
    </style>
</head>

    <div id="game-root" class="game-root">
        <!-- 3D WebGL Canvas Container -->
        <div id="game-canvas-container" class="canvas-stage">
            <canvas id="three-canvas" class="canvas-stage__webgl" aria-label="3D Zombie FPS Game View"></canvas>
        </div>

        <!-- Screen Vignettes for Damage & Low Health -->
        <div id="damage-vignette" class="fx-vignette"></div>
        <div id="low-hp-pulse" class="fx-low-hp hidden"></div>

        <!-- Floating Damage Numbers Container -->
        <div id="floating-text-container" class="absolute inset-0 pointer-events-none z-20 overflow-hidden"></div>

        <!-- Center Crosshair & Hitmarker (GPU Transform Spread + Dynamic Target Color) -->
        <div id="crosshair-wrapper" class="crosshair hidden">
            <div id="ch-top" class="crosshair__line crosshair__line--top"></div>
            <div id="ch-bottom" class="crosshair__line crosshair__line--bottom"></div>
            <div id="ch-left" class="crosshair__line crosshair__line--left"></div>
            <div id="ch-right" class="crosshair__line crosshair__line--right"></div>
            <div id="ch-dot" class="crosshair__dot"></div>

            <!-- SVG Hitmarker -->
            <svg id="hitmarker" class="hitmarker" viewBox="0 0 36 36" fill="none" aria-hidden="true">
                <line id="hm-1" x1="6" y1="6" x2="13" y2="13" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
                <line id="hm-2" x1="30" y1="6" x2="23" y2="13" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
                <line id="hm-3" x1="6" y1="30" x2="13" y2="23" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
                <line id="hm-4" x1="30" y1="30" x2="23" y2="23" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
            </svg>

            <!-- Reload Indicator Ring -->
            <div id="reload-ring" class="hidden absolute -bottom-10 whitespace-nowrap bg-amber-500/90 text-black font-bold text-xs px-2.5 py-0.5 rounded-full tracking-wider uppercase shadow-lg">
                RELOADING...
            </div>
        </div>

        <!-- IN-GAME WIDESCREEN LANDSCAPE HUD OVERLAY -->
        <div id="hud-layer" class="hidden absolute inset-0 pointer-events-none z-20 flex flex-col justify-between p-[1.2vw]">
            
            <!-- Top Widescreen Bar: Wave Info (Left), Vitals & Weapon Slots (Center), Radar & Controls (Right) -->
            <div class="flex items-start justify-between gap-[1vw] w-full">
                
                <!-- Left: Wave & Threat Status -->
                <div class="hud-panel flex items-center gap-3 pointer-events-auto">
                    <div class="w-11 h-11 rounded-lg bg-red-600/20 border border-red-500/50 flex flex-col items-center justify-center shrink-0">
                        <span class="text-[0.6rem] uppercase tracking-widest text-red-400 font-bold leading-none">WAVE</span>
                        <span id="hud-wave" class="font-display text-2xl text-white leading-none mt-0.5">1</span>
                    </div>
                    <div class="min-w-[8.5rem]">
                        <div class="flex justify-between items-center text-xs font-bold mb-1">
                            <span class="text-red-400 flex items-center gap-1">
                                <svg class="svg-icon animate-pulse"><use href="#icon-biohazard"></use></svg> HOSTILES
                            </span>
                            <span id="hud-zombies-left" class="text-white font-mono">0 / 0</span>
                        </div>
                        <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden border border-slate-700">
                            <div id="hud-wave-bar" class="hud-bar__fill bg-gradient-to-r from-red-600 to-amber-500"></div>
                        </div>
                        <div class="flex items-center justify-between mt-1 text-[0.7rem] text-slate-300">
                            <span>SCORE: <strong id="hud-score" class="text-amber-400 font-mono text-xs">0</strong></span>
                            <span id="hud-streak-badge" class="hidden px-1.5 py-0.2 bg-amber-500/20 border border-amber-400/50 text-amber-300 rounded text-[0.65rem] font-bold">
                                x1 STREAK
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Center Top: Player Vitals & Quick Weapon Switcher -->
                <div class="flex flex-col items-center gap-1.5 pointer-events-auto">
                    <div class="hud-panel flex items-center gap-3">
                        <!-- Health & Stamina -->
                        <div class="min-w-[9.5rem]">
                            <div class="flex items-baseline justify-between mb-0.5">
                                <span class="text-[0.68rem] uppercase font-bold tracking-wider text-slate-300 flex items-center gap-1">
                                    <svg class="svg-icon text-red-500"><use href="#icon-heart"></use></svg> HP
                                </span>
                                <span id="hud-hp-text" class="font-display text-xl text-white leading-none">100 <small class="text-slate-400 text-xs">/ 100</small></span>
