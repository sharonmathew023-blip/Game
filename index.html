<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orbitron Strike: Mobile FPS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
    }
    </script>
</head>
<body>
    <div id="hit-flash"></div>
    
    <div id="hud">
        HP: <span id="hp">100</span> | 
        KILLS: <span id="kills">0</span> | 
        WAVE: <span id="wave">1</span>
    </div>
    
    <div id="crosshair"></div>
    
    <div id="joystick-zone" class="control-element">
        <div id="knob"></div>
    </div>
    
    <button id="shoot-btn" class="control-element"></button>

    <div id="game-over">
        <h1>SYSTEM FAILURE</h1>
        <p>SURVIVED TO WAVE: <span id="final-wave">1</span></p>
        <p>TOTAL KILLS: <span id="final-kills">0</span></p>
        <button id="restart-btn">REBOOT SYSTEM</button>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
